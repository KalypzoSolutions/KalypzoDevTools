[versions]
loom = "1.17.19"
preprocessor = "221276c"

[plugins]
# Non-remapping Loom, for unobfuscated Minecraft (26.1+)
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
# Remapping Loom, for obfuscated Minecraft (1.21.11 and older)
loomRemap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
preprocessor = { id = "com.replaymod.preprocess", version.ref = "preprocessor" }
preprocessorRoot = { id = "com.replaymod.preprocess-root", version.ref = "preprocessor" }
