# Check these on https://fabricmc.net/develop
[versions]
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.156.0+26.2"
loom = "1.17.19"
# 1.18.32 blows up on Java 25 (ExceptionInInitializerError in lombok.permit.Permit)
lombok = "1.18.46"
# https://maven.wispforest.io/releases/io/wispforest/owo-lib
owo = "0.13.1+26.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
owo-lib = { module = "io.wispforest:owo-lib", version.ref = "owo" }
owo-sentinel = { module = "io.wispforest:owo-sentinel", version.ref = "owo" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
